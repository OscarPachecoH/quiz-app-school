<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/card.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Dashboard - Maestro</title>
</head>

<body>

    <!--Spinner de carga-->
    <div id="loadingScreen" class="position-fixed top-0 w-100 h-100 d-flex aling-items-center justify-content-center bg-white" style="z-index: 9999; transition: opacity 0.5s;">
        <div class="text-center">
            <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <h4 class="mt-4 fw-bold text-primary">Cargando dashboard</h4>
            <p class="text-muted">Por favor espere un momento</p>
        </div>
    </div>

    <!--Modal creación de examen-->
    <div class="modal fade" id="modalNuevoExamen" tabindex="-1" aria-labelledby="modalNuevoExamenLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalNuevoExamenLabel">Crear Nuevo Examen</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <!-- Información general del examen -->
                    <div class="row mb-4">
                        <div class="col-md-8">
                            <label for="tituloExamen" class="form-label fw-bold">Título del examen <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="tituloExamen" required placeholder="Ej: Matemáticas - Unidad 3">
                        </div>
                        <div class="col-md-4">
                            <label for="duracionMinutos" class="form-label fw-bold">Duración (minutos)</label>
                            <input type="number" class="form-control" id="duracionMinutos" min="5" value="60" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="descripcionExamen" class="form-label fw-bold">Descripción / Instrucciones</label>
                        <textarea class="form-control" id="descripcionExamen" rows="3" placeholder="Incluye reglas, materiales permitidos, etc."></textarea>
                    </div>

                    <hr class="my-4">

                    <!-- Sección de preguntas dinámicas -->
                    <h5 class="mb-3">Preguntas del examen</h5>
                    <div id="contenedorPreguntas" class="mb-4">
                        <!-- Aquí se agregarán las preguntas dinámicamente -->
                    </div>

                    <button type="button" class="btn btn-outline-primary mb-4" id="btnAgregarPregunta">
                        <i class="bi bi-plus-lg"></i> Agregar Pregunta
                    </button>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarExamen">
                        <i class="bi bi-save"></i> Guardar Examen
                    </button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../../assets/js/firebase-config.js"></script>
    <script src="../../assets/js/firebase-init.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/components/navbar.js"></script>
    <script src="../../assets/js/components/card.js"></script>
    <script src="../../assets/js/examenes.js"></script>
    
    <script>
        setTimeout(() => {
            if (typeof window.protectPageAndRenderNavbar === 'function') {
                console.log("Ejecutando protectPageAndRenderNavbar...");
                window.protectPageAndRenderNavbar();
            } else {
                console.error("protectPageAndRenderNavbar NO está definida después de 3s");
            }
        }, 3000);
    </script>

</body>

</html>
