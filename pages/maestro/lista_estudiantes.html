<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/loader.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Gestión de Alumnos - Maestro</title>
</head>
<body>

    <div id="loadingScreen" class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-white" style="z-index: 9999; transition: opacity 0.5s;">
        <div class="text-center">
            <span class="loader"></span>
            <h4 class="mt-5 fw-bold text-primary">Cargando lista...</h4>
            <p class="text-muted">Por favor espere un momento</p>
        </div>
    </div>

    <div class="continer mt-5 pt-4 text-center">
        <h1 class="mb-4">Gestión de Alumnos</h1>
        <button class="btn btn-success mb-4" data-bs-toggle="modal" data-bs-target="#modalNuevoAlumno">
            + Registrar Nuevo Alumno
        </button>

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Lista de Alumnos Registrados</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0" id="tablaAlumnos">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Fecha de Registro</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="alumnosBody">

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuevoAlumno" tabindex="-1" aria-labelledby="modalNuevoAlumnoLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header modal-agreAlum text-white">
                    <h5 class="modal-title" id="modalNuevoAlumnoLabel">Registrar Nuevo Alumno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevoAlumno">
                        <div class="mb-3">
                            <label for="nombreAlumno" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombreAlumno" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailAlumno" class="form-label">Correo electronico</label>
                            <input type="email" class="form-control" id="emailAlumno" required>
                        </div>
                        <div class="mb-3">
                            <label for="passwordAlumno" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="passwordAlumno" required minlength="6">
                            <small class="form-text text-muted">Minimo 6 caracteres. El alumno podra cambiarla despues.</small>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="btnGuardarAlumno">Registrar Alumno</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../../assets/js/firebase-config.js"></script>
    <script src="../../assets/js/firebase-init.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/components/navbar.js"></script>
    <script src="../../assets/js/getUsers.js"></script>
    <script>
        setTimeout(() => {
            if (typeof window.protectPageAndRenderNavbar === 'function') {
                console.log("Ejecutando protectPageAndRenderNavbar...");
                window.protectPageAndRenderNavbar();
            } else {
                console.error("protectPageAndRenderNavbar NO está definida después de 3s");
            }
        }, 3000);
        document.addEventListener('DOMContentLoaded', () => {
            cargarAlumnos();
        })
    </script>

</body>
</html>
