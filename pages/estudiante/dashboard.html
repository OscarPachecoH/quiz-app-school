<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/card.css">
    <link rel="stylesheet" href="/assets/css/loader.css">k
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Dashboard - Estudiante</title>
</head>

<body>

    <!--Spinner de carga-->
    <div id="loadingScreen" class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-white" style="z-index: 9999; transition: opacity 0.5s;">
        <div class="text-center">
            <span class="loader"></span>
            <h4 class="mt-5 fw-bold text-estudiante">Cargando contenido...</h4>
            <p class="text-muted">Por favor espere un momento</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../../assets/js/firebase-config.js"></script>
    <script src="../../assets/js/firebase-init.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/components/navbar.js"></script>
    <script src="../../assets/js/components/card.js"></script>
    <script>
        setTimeout(() => {
            if (typeof window.protectPageAndRenderNavbar === 'function') {
                console.log("Ejecutando protectPageAndRenderNavbar...");
                window.protectPageAndRenderNavbar();
                window.renderTestInDashboard();
            } else {
                console.error("protectPageAndRenderNavbar NO está definida después de 3s");
            }
        }, 3000);
    </script>

</body>

</html>
